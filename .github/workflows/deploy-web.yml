name: Deploy Web to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  # Manual redeploys from the Actions tab — needed when only the WEB_ENV_PRODUCTION secret
  # changes (secret edits do not trigger a push).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* values are inlined into the client bundle at BUILD time, and no env file
      # is committed — without this, CI would silently ship a Base-only bundle (no DustSweep
      # multichain config, no router addresses). The WEB_ENV_PRODUCTION secret holds the full
      # production .env content; the job-level secrets above still take precedence over the file.
      - name: Write production env (NEXT_PUBLIC bundle values)
        env:
          WEB_ENV_PRODUCTION: ${{ secrets.WEB_ENV_PRODUCTION }}
        run: |
          if [ -z "$WEB_ENV_PRODUCTION" ]; then
            echo "::error::WEB_ENV_PRODUCTION secret is empty — refusing to build a bundle without NEXT_PUBLIC config (it would ship Base-only and drop Ethereum/BSC/Robinhood from prod)."
            exit 1
          fi
          printf '%s' "$WEB_ENV_PRODUCTION" > .env.production

      # Single-step build: the OpenNext CLI runs `pnpm build` itself (keeping the 4GB heap flag
      # from package.json) with NEXT_PRIVATE_STANDALONE=true. Splitting this into a plain
      # `next build` + `--skipNextBuild` breaks with ENOENT .next/standalone/... because
      # next.config.js does not set `output: "standalone"` (root cause of every red deploy
      # since 2026-07-11; runs before that failed for other reasons).
      - name: Build (Next.js + OpenNext Cloudflare bundle)
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        run: pnpm exec opennextjs-cloudflare deploy -- --keep-vars
