name: Deploy memefun (testnet) to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/memefun/**'
      - '.github/workflows/deploy-memefun.yml'
  # Manual redeploys from the Actions tab, e.g. after MEMEFUN_TESTNET_ENV changes.
  workflow_dispatch:

concurrency:
  group: deploy-memefun
  cancel-in-progress: false

jobs:
  deploy:
    # Off until the testnet contracts and API exist: `gh variable set MEMEFUN_TESTNET_DEPLOY --body on`.
    if: ${{ vars.MEMEFUN_TESTNET_DEPLOY == 'on' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/memefun
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      NEXT_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/memefun/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* values are inlined at build time. MEMEFUN_TESTNET_ENV holds the testnet's
      # NEXT_PUBLIC_MEMEFUN_API_URL, NEXT_PUBLIC_MEMEFUN_CHAIN_ID=84532 and NEXT_PUBLIC_APP_URL.
      # Without it the build would quietly be the simulated preview, so refuse.
      - name: Write testnet env (NEXT_PUBLIC bundle values)
        env:
          MEMEFUN_TESTNET_ENV: ${{ secrets.MEMEFUN_TESTNET_ENV }}
        run: |
          if [ -z "$MEMEFUN_TESTNET_ENV" ]; then
            echo "::error::MEMEFUN_TESTNET_ENV secret is empty; refusing to build without the testnet API and chain."
            exit 1
          fi
          printf '%s' "$MEMEFUN_TESTNET_ENV" > .env.production
          grep -q '^NEXT_PUBLIC_MEMEFUN_CHAIN_ID=84532$' .env.production || { echo "::error::MEMEFUN_TESTNET_ENV must set NEXT_PUBLIC_MEMEFUN_CHAIN_ID=84532"; exit 1; }
          grep -q '^NEXT_PUBLIC_MEMEFUN_API_URL=https://' .env.production || { echo "::error::MEMEFUN_TESTNET_ENV must set an https NEXT_PUBLIC_MEMEFUN_API_URL"; exit 1; }

      # The build must carry the Sepolia contract addresses (src/lib/contracts/deployments.ts), or
      # it would ship as the preview.
      - name: Check the deployment is in the build
        run: |
          if ! grep -q '84532: {' src/lib/contracts/deployments.ts; then
            echo "::error::No Base Sepolia deployment in src/lib/contracts/deployments.ts; run pnpm deployments and commit it."
            exit 1
          fi

      - name: Typecheck, lint and test
        run: pnpm typecheck && pnpm lint && pnpm test

      # Single step: the OpenNext CLI runs `pnpm build` itself with NEXT_PRIVATE_STANDALONE=true
      # (see deploy-web.yml for why a separate `next build` breaks).
      - name: Build (Next.js + OpenNext Cloudflare bundle)
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        run: pnpm exec opennextjs-cloudflare deploy -- --keep-vars
